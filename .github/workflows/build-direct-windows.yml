name: Build Direct App (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - "private-ai-direct-app/**"
      - ".github/workflows/build-direct-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: "private-ai-direct-app/package-lock.json"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify required secrets
        run: |
          test -n "${{ secrets.GEMINI_API_KEY }}" || { echo "Missing secret: GEMINI_API_KEY"; exit 1; }
          test -n "${{ secrets.KIMI_API_KEY }}" || { echo "Missing secret: KIMI_API_KEY"; exit 1; }
          test -n "${{ secrets.OPENROUTER_API_KEY }}" || { echo "Missing secret: OPENROUTER_API_KEY"; exit 1; }

      - name: Generate providers.json from secrets
        working-directory: private-ai-direct-app
        run: |
          cat > src-tauri/resources/providers.json <<EOF
          {
            "providers": [
              {
                "provider": "gemini",
                "api_key": "${{ secrets.GEMINI_API_KEY }}",
                "base_url": "https://generativelanguage.googleapis.com/v1beta",
                "models": ["gemini-2.0-flash", "gemini-1.5-pro"],
                "enabled": true
              },
              {
                "provider": "kimi",
                "api_key": "${{ secrets.KIMI_API_KEY }}",
                "base_url": "https://api.moonshot.cn/v1",
                "models": ["kimi-k2.5", "moonshot-v1-8k", "moonshot-v1-32k"],
                "enabled": true
              },
              {
                "provider": "openrouter",
                "api_key": "${{ secrets.OPENROUTER_API_KEY }}",
                "base_url": "https://openrouter.ai/api/v1",
                "models": ["anthropic/claude-opus-4.6", "anthropic/claude-sonnet-4.6"],
                "enabled": true,
                "title": "AI Hub Direct"
              }
            ]
          }
          EOF

      - name: Install frontend deps
        working-directory: private-ai-direct-app
        run: |
          npm config set registry https://registry.npmjs.org/
          npm ci

      - name: Build Windows installer
        working-directory: private-ai-direct-app
        run: npm run tauri:build

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-hub-direct-windows
          path: |
            private-ai-direct-app/src-tauri/target/release/bundle/nsis/*.exe
            private-ai-direct-app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
